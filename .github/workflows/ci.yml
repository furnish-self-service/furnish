name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  check:
    name: Unit tests and fake e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo t
      - run: cargo b && tests/e2e.sh

  linux-binary:
    name: Static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq musl-tools && rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/furnish

  linux:
    name: e2e ${{ matrix.image }}
    needs: linux-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - opensuse/tumbleweed
          - archlinux:latest
          - nixos/nix:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: chmod +x bin/furnish && tests/distro.sh "${{ matrix.image }}" bin/furnish

  native:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - if: runner.os == 'Windows'
        run: winget --version
      - shell: bash
        run: tests/e2e.sh --real target/release/furnish${{ runner.os == 'Windows' && '.exe' || '' }}

  gui:
    name: GUI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: gui
      # Release build with installers: deb/rpm/AppImage, dmg/app, msi/nsis.
      - run: npx tauri build
        working-directory: gui
      # Real app under Xvfb, driven via WebDriver; also checks GUI elevation never uses sudo.
      - if: runner.os == 'Linux'
        run: tests/ui/run.sh target/release/furnish-gui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furnish-gui-${{ runner.os }}
          path: |
            target/release/bundle/
            target/ui-test.png
