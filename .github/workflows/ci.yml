name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  check:
    name: Unit tests and fake e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo t
      - run: cargo b && tests/check.sh
      # The action collection repositories use (check/action.yml), with this build.
      - uses: ./check
        with:
          path: tests/fixtures/collection
          furnish: target/fast/furnish
      # With DSC's resources beside furnish, as the installers ship them (e2e installs an app with File/Content).
      - run: cargo b && node scripts/fetch-dsc.mjs target/fast/dsc && tests/e2e.sh

  linux-binary:
    name: Static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq musl-tools && rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/furnish

  linux:
    name: e2e ${{ matrix.image }}
    needs: linux-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - opensuse/tumbleweed
          - archlinux:latest
          - nixos/nix:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: chmod +x bin/furnish && tests/distro.sh "${{ matrix.image }}" bin/furnish

  service:
    name: service (users without admin rights)
    needs: linux-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: node scripts/fetch-dsc.mjs dsc
      - run: chmod +x bin/furnish && tests/service.sh bin/furnish dsc

  nix:
    name: Nix (shared profile, updates)
    needs: linux-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: chmod +x bin/furnish && tests/nix.sh bin/furnish
        env:
          GITHUB_TOKEN: ${{ github.token }}

  flake:
    name: Nix flake (CLI and desktop app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#furnish .#furnish-gui

  git-auth:
    name: private collections (HTTPS credentials, SSH)
    needs: linux-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: chmod +x bin/furnish && tests/git-auth.sh bin/furnish

  licenses:
    name: THIRD-PARTY-LICENSES.html is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - run: npm ci
        working-directory: gui
      - run: node scripts/licenses.mjs && git diff --exit-code THIRD-PARTY-LICENSES.html || { echo "::error::run node scripts/licenses.mjs and commit THIRD-PARTY-LICENSES.html"; exit 1; }

  checkout:
    name: disk use and falling back (blobless, shallow, installers on demand, earlier versions)
    needs: linux-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: chmod +x bin/furnish && tests/checkout.sh bin/furnish

  endpoint:
    name: endpoint with ${{ matrix.proxy }} (SSO, git allowlist, reports)
    needs: linux-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each one runs packaging/endpoint/<proxy>/, the files the docs show.
        proxy: [caddy, nginx, traefik, envoy, haproxy]
    env:
      PROXY: ${{ matrix.proxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: bin
      - run: chmod +x bin/furnish && FURNISH_BIN=$PWD/bin/furnish tests/endpoint/run.sh

  reports:
    name: reports in Loki and Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs packaging/endpoint/reports/, the files the docs show.
      - run: tests/reports/run.sh

  native:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release
      - if: runner.os == 'Windows'
        run: winget --version
      # A real .msi for the Furnish/Installer test (macOS builds .pkg/.dmg inside the test).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build tests/fixtures/installers/demo.wxs -bindpath tests/fixtures/installers -o target/furnish-demo.msi
          "FURNISH_TEST_MSI=$((Get-Location).Path -replace '\\','/')/target/furnish-demo.msi" >> $env:GITHUB_ENV
      - run: node scripts/fetch-dsc.mjs target/release/dsc
      - shell: bash
        run: tests/e2e.sh --real target/release/furnish${{ runner.os == 'Windows' && '.exe' || '' }}

  service-macos:
    name: service macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release
      - run: tests/service-macos.sh target/release/furnish

  service-windows:
    name: service windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release
      - shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build tests/fixtures/installers/demo.wxs -bindpath tests/fixtures/installers -o target/furnish-demo.msi
          tests/service.ps1 -Furnish target/release/furnish.exe -Msi target/furnish-demo.msi

  linux-packages:
    name: Linux packages (built on Ubuntu 22.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            target/jammy
            .cache/cargo-registry
          key: jammy-${{ hashFiles('Cargo.lock') }}
          restore-keys: jammy-
      - run: |
          # Builds of main are alpha releases: 0.1.0+alpha.<run>, rising with every run.
          version=$(jq -r .version gui/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF" = refs/heads/main ]; then version="$version+alpha.$GITHUB_RUN_NUMBER"; fi
          mkdir -p .cache/cargo-registry
          docker run --rm -v "$PWD:/src" -v "$PWD/.cache/cargo-registry:/root/.cargo/registry" -w /src \
            -e HOST_UID=$(id -u) -e FURNISH_VERSION="$version" ubuntu:22.04 packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: furnish-linux-packages
          path: |
            target/jammy/release/bundle/deb/*.deb
            target/jammy/release/bundle/rpm/*.rpm

  packages:
    name: install on ${{ matrix.image }}
    needs: linux-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:22.04, ubuntu:24.04, fedora:latest, opensuse/leap:15.6, opensuse/tumbleweed, almalinux:10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-packages
          path: bundle
      - run: tests/packages.sh "${{ matrix.image }}" bundle

  # The alpha channel of the package repository (GitHub Pages), from main once everything passed.
  publish-alpha:
    name: publish alpha packages
    if: github.ref == 'refs/heads/main'
    needs: [check, linux, service, nix, git-auth, checkout, endpoint, native, service-macos, service-windows, packages, gui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-packages
          path: new
      - uses: actions/download-artifact@v4
        with:
          pattern: furnish-desktop-*
          path: new/desktop
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: new/cli
      - run: sudo apt-get install -y -qq apt-utils createrepo-c
      - run: echo "$REPO_SIGNING_KEY" | gpg --batch --import
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
      - run: |
          packaging/repo/fetch.sh "$BASE_URL" site
          packaging/repo/publish.sh alpha new site
        env:
          BASE_URL: https://furnish-self-service.github.io/furnish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  repository:
    name: install from the repository on ${{ matrix.image }}
    needs: publish-alpha
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, fedora:latest, opensuse/tumbleweed, almalinux:10]
    steps:
      - uses: actions/checkout@v4
      - run: tests/repo.sh "${{ matrix.image }}" https://furnish-self-service.github.io/furnish alpha

  gui:
    name: GUI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm test && npx svelte-check --threshold error
        working-directory: gui
      # Builds of main are alpha releases (see linux-packages); the bundled CLI reports it.
      - shell: bash
        run: |
          v=$(jq -r .version gui/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF" = refs/heads/main ]; then v="$v+alpha.$GITHUB_RUN_NUMBER"; fi
          echo "FURNISH_VERSION=$v" >> "$GITHUB_ENV"
      # Release build with installers: deb/rpm/AppImage, dmg/app, msi/nsis, each with the CLI.
      - run: npm run bundle
        working-directory: gui
      - name: Installers include the CLI (the furnish service runs it) and DSC's resources
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   dpkg-deb -c target/release/bundle/deb/*.deb | grep -E 'usr/bin/furnish$'
                     dpkg-deb -c target/release/bundle/deb/*.deb | grep THIRD-PARTY-LICENSES.html
                     dpkg-deb -c target/release/bundle/deb/*.deb | grep -E '^-rwxr-xr-x .* (\./)?usr/lib/furnish/dsc/(dsc|filecontent|runcommandonset)$' | wc -l | grep -qx 3
                     dpkg-deb -c target/release/bundle/deb/*.deb | grep -E 'usr/lib/furnish/dsc/psDscAdapter/psDscAdapter.psm1$'
                     if dpkg-deb -c target/release/bundle/deb/*.deb | grep -E 'dsc/(y2j|dscecho)$'; then exit 1; fi ;;
            macOS)   test -x target/release/bundle/macos/furnish.app/Contents/MacOS/furnish
                     test -x target/release/bundle/macos/furnish.app/Contents/Resources/dsc/dsc
                     test -x target/release/bundle/macos/furnish.app/Contents/Resources/dsc/filecontent
                     test -f target/release/bundle/macos/furnish.app/Contents/Resources/dsc/NOTICE.txt ;;
            Windows) grep -q 'furnish.exe' target/release/wix/x64/main.wxs ;;
          esac
      # Windows has no git: furnish uses the MinGit the installer ships, with git-lfs.
      - name: The installed app uses the bundled git when the system has none
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $msi = (Get-Item target\release\bundle\msi\*.msi).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode) { throw "msiexec exited with $($p.ExitCode)" }
          $app = "$env:ProgramFiles\furnish"
          if (-not (Test-Path "$app\THIRD-PARTY-LICENSES.html")) { throw 'no THIRD-PARTY-LICENSES.html' }
          foreach ($f in 'dsc.exe', 'filecontent.exe', 'environment_variable.exe', 'registry.exe', 'NOTICE.txt', 'psDscAdapter\psDscAdapter.psm1') {
            if (-not (Test-Path "$app\dsc\$f")) { throw "no dsc\$f" }
          }
          if (Test-Path "$app\dsc\y2j.exe") { throw 'dsc\y2j.exe is shipped' }
          & "$app\git\cmd\git.exe" lfs version
          New-Item -ItemType Directory t\repo | Out-Null
          Copy-Item -Recurse tests\fixtures\collection\* t\repo
          git -C t\repo init -q; git -C t\repo add -A; git -C t\repo -c user.name=t -c user.email=t@t commit -qm init
          $env:FURNISH_DATA_DIR = "$PWD\t\data"; $env:PATH = 'C:\Windows\System32;C:\Windows'
          & "$app\furnish.exe" collection add "$PWD\t\repo" --name fixture
          if (-not (& "$app\furnish.exe" collection list | Select-String fixture)) { throw 'collection not added' }
      # Real app under Xvfb, driven via WebDriver; also checks GUI elevation never uses sudo.
      - if: runner.os == 'Linux'
        run: tests/ui/run.sh target/release/furnish-gui
      # The macOS and Windows installers for the package repository (publish-alpha), by version.
      - if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p desktop
          case "$RUNNER_OS" in
            macOS)   cp target/release/bundle/dmg/*.dmg "desktop/furnish_${FURNISH_VERSION}_$(uname -m).dmg" ;;
            Windows) cp target/release/bundle/msi/*.msi "desktop/furnish_${FURNISH_VERSION}_x64.msi" ;;
          esac
      - if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: furnish-desktop-${{ runner.os }}
          path: desktop/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furnish-gui-${{ runner.os }}
          path: |
            target/release/bundle/
            target/ui-test.png
