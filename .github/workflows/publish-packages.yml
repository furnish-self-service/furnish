name: Publish channel packages

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
    secrets:
      REPO_SIGNING_KEY:
        required: true

env:
  CHANNEL: ${{ inputs.channel }}

jobs:
  build:
    name: Build the package repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.publish.outputs.version }}
      artifact: ${{ steps.publish.outputs.artifact }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-packages
          path: new
      - uses: actions/download-artifact@v4
        with:
          pattern: furnish-desktop-*
          path: new/desktop
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: furnish-linux-x86_64
          path: new/cli
      # The updater's signatures of the .msi and .app.tar.gz (update-feed job): publish.sh writes the feed.
      - uses: actions/download-artifact@v4
        with:
          name: furnish-update-signatures
          path: new/desktop
      - run: sudo apt-get install -y -qq apt-utils createrepo-c
      - run: echo "$REPO_SIGNING_KEY" | gpg --batch --import
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
      - id: publish
        run: |
          packaging/repo/fetch.sh "$BASE_URL" site
          case "$CHANNEL" in
            alpha) keep=2 ;;
            stable) keep=1 ;;
            *) exit 1 ;;
          esac
          KEEP=$keep packaging/repo/publish.sh "$CHANNEL" new site
          # Two channels share the 1 GB Pages site.
          test "$(du -sb site | cut -f1)" -lt 1000000000
          version=$(jq -er '.version | strings | select(length > 0)' "site/$CHANNEL/latest.json")
          expected=$(jq -er .version gui/src-tauri/tauri.conf.json)
          if [ "$CHANNEL" = alpha ]; then expected="$expected-alpha.$GITHUB_RUN_NUMBER"; fi
          test "$version" = "$expected"
          REQUIRE="windows-x86_64 darwin-aarch64" node scripts/verify-update-feed.mjs "site/$CHANNEL/latest.json" "site/$CHANNEL"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
        env:
          BASE_URL: https://furnish-self-service.github.io/furnish
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: site

  deploy:
    name: Deploy the package repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}

  verify:
    name: Verify the public update feed
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify the signed downloads for this deployment
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          REQUIRE: windows-x86_64 darwin-aarch64
        run: |
          : "${EXPECTED_VERSION:?missing deployed version}"
          node --version
          node scripts/verify-update-feed.mjs "https://furnish-self-service.github.io/furnish/$CHANNEL/latest.json" &
          verifier=$!
          echo "Waiting for verifier process $verifier"
          status=0
          wait "$verifier" || status=$?
          echo "Verifier process $verifier exited with status $status"
          exit "$status"
