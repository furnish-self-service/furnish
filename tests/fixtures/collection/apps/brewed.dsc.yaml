# Needs Homebrew; depends on the homebrew app, so installing it installs that first. Homebrew
# knows it by another name (namesByManager.brew).
metadata:
  furnish:
    description: A tool installed with Homebrew
    categories: [Test]
    dependencies:
      - app: homebrew
        required: true
resources:
  - name: brewed tool
    type: Furnish/Package
    condition: "[not(equals(context().os.family, 'Windows'))]"
    properties:
      name: brewed-generic
      namesByManager: { brew: brewed-tool }
      packageManager: brew
