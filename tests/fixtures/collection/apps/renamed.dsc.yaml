# The same package has another name with some package managers (e.g. code / vscode).
parameters:
  pacmanPackage:
    type: string
    defaultValue: renamed
metadata:
  furnish:
    description: A package named differently per package manager
    categories: [Test]
resources:
  - name: renamed
    type: Furnish/Package
    condition: "[not(equals(context().os.family, 'Windows'))]"
    properties:
      name: renamed-generic
      namesByManager:
        pacman: "[parameters('pacmanPackage')]"
        nix: renamed-nix
