user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
    # Log the auth scheme (never the credentials), the Git-Protocol header and what the proxy says
    # about the client of every request.
    map $http_authorization $auth_scheme { "~^(\S+)" $1; default none; }
    log_format upstream 'upstream $request_method $request_uri $status auth=$auth_scheme proto="$http_git_protocol" '
        'xff="$http_x_forwarded_for" xri="$http_x_real_ip" xfh="$http_x_forwarded_host" xfp="$http_x_forwarded_proto" '
        'fwd="$http_forwarded" xfport="$http_x_forwarded_port" xfprefix="$http_x_forwarded_prefix"';
    access_log /dev/stdout upstream;
    client_max_body_size 0;

    server {
        listen 80;
        location = /it/catalog.git/info/lfs/objects/batch {
            auth_basic "fake-gitlab";
            auth_basic_user_file /etc/nginx/htpasswd;
            include fastcgi_params;
            fastcgi_pass unix:/run/fcgiwrap/sock;
            fastcgi_param SCRIPT_FILENAME /lfs-batch.sh;
        }
        location ~ ^/it/[^/]+\.git/ {
            auth_basic "fake-gitlab";
            auth_basic_user_file /etc/nginx/htpasswd;
            include fastcgi_params;
            fastcgi_pass unix:/run/fcgiwrap/sock;
            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
            fastcgi_param GIT_PROJECT_ROOT /srv/git;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param PATH_INFO $uri;
            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_param GIT_PROTOCOL $http_git_protocol;
        }
        # Anything else (e.g. /api/v4/projects) answers 200, so a leak through the proxy is visible.
        location / {
            return 200 "FAKE-GITLAB-REACHED\n";
        }
    }
}
