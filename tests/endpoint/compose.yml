# Test overlay for packaging/endpoint/docker-compose.yml, used by tests/endpoint/run.sh.
# Paths use ${TEST_DIR}: relative paths would resolve against packaging/endpoint/.
# The client stands for the internet ("edge"); the fake GitLab is only on "backend", like an
# internal GitLab that only the proxy reaches. The fake IdP is on both.
services:
  proxy:
    ports: !reset []
    networks:
      edge:
        aliases: [furnish.test]
      backend: {}

  oauth2-proxy:
    depends_on: [mock-oidc]

  # Fake IdP; issuers are http://mock-oidc:8080/<any name>, each with its own signing key.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5
    networks: [edge, backend]

  gitlab:
    build: {context: "${TEST_DIR}", target: gitlab}
    image: furnish-endpoint-test-gitlab
    networks: [backend]
    environment:
      DEPLOY_USER: ${DEPLOY_USER}
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}

  client:
    build: {context: "${TEST_DIR}", target: client}
    image: furnish-endpoint-test-client
    profiles: [client]
    networks: [edge]
    environment:
      PROXY: ${PROXY}
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      ACME_GITLAB_AUTH: ${ACME_GITLAB_AUTH}
    volumes:
      - ${TLS_DIR}:/certs:ro
      - ${TEST_DIR}/checks.sh:/checks.sh:ro
      - ${TEST_DIR}/furnish.sh:/furnish.sh:ro
      - ${FURNISH_BIN:-/dev/null}:/usr/local/bin/furnish:ro
