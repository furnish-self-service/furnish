# Licenses furnish may ship (cargo about generate checks every crate against them). For crates
# offering a choice, the first accepted one in this order is listed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
# Only what the installers contain: the targets furnish is built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# DSC crates come from the DSC repository, which is MIT licensed; their manifests say nothing.
[dsc-lib.clarify]
license = "MIT"
[[dsc-lib.clarify.git]]
path = "LICENSE"
checksum = "7c77a44a8acd9b41fdc209864a8016b3d430b5d0e09309818d5b7444336df744"

