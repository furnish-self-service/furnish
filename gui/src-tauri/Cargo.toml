[package]
name = "furnish-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/furnish-self-service/furnish"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
furnish = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Same glib as Tauri's GTK stack, used to set the Wayland app ID (see main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
