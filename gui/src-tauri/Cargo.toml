[package]
name = "furnish-gui"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
furnish = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
serde_json = "1"

# Same glib as Tauri's GTK stack, used to set the Wayland app ID (see main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
