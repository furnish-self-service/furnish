[package]
name = "furnish"
version = "0.1.0"
edition = "2024"
# NixOS stable (nixos-25.11) ships Rust 1.91; cargo picks dependency versions that support it.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/furnish-self-service/furnish"

[workspace]
members = [".", "gui/src-tauri"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
dsc-lib = { git = "https://github.com/PowerShell/DSC", tag = "v3.3.0" }
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sysinfo = "0.38.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# dsc-lib's grammar crate is generated at build time upstream; use our vendored, pre-generated copy.
[patch."https://github.com/PowerShell/DSC"]
tree-sitter-dscexpression = { path = "vendor/tree-sitter-dscexpression" }

# ponytail: dsc-lib-jsonschema's build.rs shells out to pwsh on PROFILE=debug builds only.
# A profile inheriting from `release` reports PROFILE=release, so it builds without PowerShell
# while keeping dev-speed settings. Use the cargo aliases in .cargo/config.toml (`cargo b/t/r`).
[profile.fast]
inherits = "release"
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
winreg = "0.56.0"
