# furnish endpoint: the parts every proxy uses. Start it together with one proxy's file:
#
#   docker compose -f docker-compose.yml -f caddy/compose.yml up -d     (or nginx, traefik, envoy, haproxy)
#
# The proxy terminates TLS, lets only the allowlisted git requests and POST /events through, asks
# oauth2-proxy (or checks the token itself) whether the user's ID token is valid, and forwards git
# requests to GitLab with a read-only deploy token. GitLab stays internal: only the proxy reaches
# it. Settings come from .env next to this file (see .env.example and README.md).
name: furnish-endpoint

services:
  # Not published: only the proxy reaches it, and only its /oauth2/auth check is used.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      # Bearer JWTs must carry this client ID as audience (the "aud" claim of an ID token).
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:-furnish}
      # furnish is a public client. oauth2-proxy insists on a secret but never uses it
      # for bearer-token checks, so any placeholder works.
      OAUTH2_PROXY_CLIENT_SECRET: unused-public-client
      # Required by oauth2-proxy even though no cookie session is ever created here.
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET (openssl rand -base64 32 | tr -- +/ -_)}
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      # An invalid bearer token gets 403, not a redirect to a login page.
      OAUTH2_PROXY_BEARER_TOKEN_LOGIN_FALLBACK: "false"
      # Restrict by the token's e-mail domain; "*" accepts every user of the IdP.
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-*}
      # The answer names the user (X-Auth-Request-Email), which the proxy passes on with reports.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"

  # Receives furnish's reports (POST /events) from the proxy; see vector/vector.yaml for where
  # they go. Not published.
  vector:
    image: timberio/vector:0.60.0-alpine
    restart: unless-stopped
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
