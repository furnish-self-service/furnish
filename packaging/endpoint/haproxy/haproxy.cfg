# furnish endpoint with HAProxy: lets furnish users clone selected internal GitLab repositories
# with their own OIDC sign-in, without exposing GitLab itself, and send reports to Vector.
#
#   furnish ──HTTPS, Bearer <ID token>──▶ HAProxy (checks the JWT itself, with the IdP's public key)
#                                           ├──Basic <deploy token>──▶ GitLab (one fixed repository path)
#                                           └──POST /events, X-Furnish-User──▶ Vector
#
# HAProxy has no auth subrequest, so oauth2-proxy is not used: the JWT is verified here with
# native converters (jwt_verify and friends). No Lua.
#
# Settings come from environment variables (see haproxy/compose.yml and haproxy/README.md);
# haproxy/start.sh derives GITLAB_ADDR, GITLAB_HOST, GITLAB_SNI, GITLAB_TLS, EMAIL_ANY_DOMAIN and
# EMAIL_SUFFIXES from GITLAB_URL and ALLOWED_EMAIL_DOMAINS.

global
    log stdout format raw local0 info
    # Load /certs/tls.key next to /certs/tls.crt (by default HAProxy would look for tls.crt.key).
    ssl-load-extra-del-ext
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout http-request 10s
    # A large clone can take a while before GitLab sends the first byte.
    timeout server 300s

# Docker's DNS, so HAProxy starts even if GitLab or Vector cannot be resolved yet.
resolvers docker
    parse-resolv-conf

frontend http
    bind :80
    http-request redirect scheme https code 301

frontend https
    bind :443 ssl crt /certs/tls.crt alpn h2,http/1.1

    # Only this site; requests for any other host name get nothing.
    http-request return status 404 unless { req.hdr(host),field(1,:) -m str -i "${FURNISH_HOST}" }

    # Discovery document for furnish; public, no sign-in needed. HAProxy reads the file at start
    # and on reload.
    http-request return status 200 content-type application/json file /srv/furnish/furnish.json hdr Cache-Control "max-age=300" if { method GET HEAD } { path -m str /.well-known/furnish.json }

    # Only the proxy names the user, and nothing upstream needs a cookie: drop what a client sends.
    http-request del-header X-Furnish-User
    http-request del-header X-Auth-Request-Email
    http-request del-header Cookie

    # A collection: one public, read-only path mapped to exactly one upstream repository, and the
    # variable with that project's deploy token. Only these two requests are proxied, compared byte
    # for byte against the raw request path and query (pathq; HAProxy does not normalise unless a
    # normalize-uri rule says so, so `..`, `%2e`, `%2f`, `//`, extra segments or query parameters
    # never match):
    #   GET  /git/<public name>.git/info/refs?service=git-upload-pack
    #   POST /git/<public name>.git/git-upload-pack
    # Git protocol v2 uses exactly these two requests too (it signals v2 in the Git-Protocol header).
    # Everything else, including pushes (git-receive-pack) and the dumb protocol, gets 404.
    #
    # Collection acme → /it/catalog.git with ACME_GITLAB_AUTH:
    http-request set-var(txn.upstream) str(/it/catalog.git/info/refs?service=git-upload-pack) if { method GET } { pathq -m str /git/acme.git/info/refs?service=git-upload-pack }
    http-request set-var(txn.upstream) str(/it/catalog.git/git-upload-pack) if { method POST } { pathq -m str /git/acme.git/git-upload-pack }
    http-request set-var(txn.gitlab_auth) str("${ACME_GITLAB_AUTH}") if { var(txn.upstream) -m found } { pathq -m beg /git/acme.git/ }

    acl to_gitlab var(txn.upstream) -m found
    # Reports from furnish: exactly POST /events, no query.
    acl to_events method POST
    acl to_events_path pathq -m str /events
    http-request return status 404 unless to_gitlab || to_events to_events_path

    # Reports are at most 1 MiB. HAProxy streams bodies, so the limit is enforced on the declared
    # length; HAProxy rejects bodies longer than their Content-Length. furnish always sends one.
    http-request return status 411 if !to_gitlab !{ req.hdr_cnt(content-length) eq 1 }
    http-request return status 413 if !to_gitlab { req.hdr_val(content-length) gt 1048576 }

    # Only "Authorization: Bearer <JWT>" may authenticate (exactly one header, scheme spelled
    # "Bearer" like oauth2-proxy expects). A cookie or a JWT sent as a Basic password never does.
    http-request return status 401 unless { req.fhdr_cnt(authorization) eq 1 } { req.fhdr(authorization) -m reg '^Bearer [^[:space:]]+$' }
    http-request set-var(txn.jwt) http_auth_bearer

    # The checks oauth2-proxy does for a bearer ID token. Each rule passes only on a positive
    # match, so a missing claim or an undecodable token fails it.
    # Signature: RS256 only (never "none", never HMAC with the public key as secret), made with the
    # IdP's key from haproxy/idp.pem.
    http-request return status 401 unless { var(txn.jwt),jwt_header_query('$.alg') -m str RS256 }
    http-request return status 401 unless { var(txn.jwt),jwt_verify("RS256","/etc/haproxy/idp.pem") -m int 1 }
    # Issuer, exactly as in OIDC_ISSUER_URL.
    http-request return status 401 unless { var(txn.jwt),jwt_payload_query('$.iss') -m str "${OIDC_ISSUER_URL}" }
    # Audience: the client ID, as a string or as one element of an array. json_query returns an
    # array as its JSON text, e.g. ["furnish","other"].
    http-request set-var(txn.aud) var(txn.jwt),jwt_payload_query('$.aud')
    acl aud_ok var(txn.aud) -m str "${OIDC_CLIENT_ID}" "[\"${OIDC_CLIENT_ID}\"]"
    acl aud_ok var(txn.aud) -m beg "[\"${OIDC_CLIENT_ID}\","
    acl aud_ok var(txn.aud) -m end ",\"${OIDC_CLIENT_ID}\"]"
    acl aud_ok var(txn.aud) -m sub ",\"${OIDC_CLIENT_ID}\","
    http-request return status 401 unless aud_ok
    # Not expired: exp - now > 0.
    http-request set-var(txn.now) date
    http-request return status 401 unless { var(txn.jwt),jwt_payload_query('$.exp','int'),sub(txn.now) -m int gt 0 }
    # A verified e-mail address (JSON true, not a string), one "@", no spaces or control characters,
    # since it ends up in a header; in ALLOWED_EMAIL_DOMAINS unless that is "*".
    http-request return status 403 unless { var(txn.jwt),jwt_payload_query('$.email_verified') -m bool }
    http-request set-var(txn.email) var(txn.jwt),jwt_payload_query('$.email')
    http-request return status 403 unless { var(txn.email) -m reg '^[^@[:space:][:cntrl:],]+@[^@[:space:][:cntrl:],]+$' }
.if streq("$EMAIL_ANY_DOMAIN","0")
    http-request return status 403 unless { var(txn.email),lower -m end "${EMAIL_SUFFIXES[*]}" }
.endif

    use_backend gitlab if to_gitlab
    use_backend vector

backend gitlab
    # The upstream URI is fixed; nothing from the client's path or query reaches GitLab.
    http-request set-uri %[var(txn.upstream)]
    http-request set-header Host "${GITLAB_HOST}"
    # Replace the user's ID token with the read-only deploy token (base64 of "username:token").
    http-request set-header Authorization "Basic %[var(txn.gitlab_auth)]"
    # Drop other ways the client could present GitLab credentials of its own.
    http-request del-header Private-Token
    http-request del-header Job-Token
    http-request del-header Deploy-Token
    # If GitLab rejects the deploy token, say so instead of making git ask the user for a password.
    http-response return status 502 content-type text/plain string "upstream rejected the endpoint's deploy token" if { status 401 403 }
    http-response del-header Set-Cookie
    http-response del-header WWW-Authenticate
.if streq("$GITLAB_TLS","1")
    server gitlab "${GITLAB_ADDR}" resolvers docker init-addr last,libc,none ssl verify required ca-file @system-ca sni str("${GITLAB_SNI}")
.else
    server gitlab "${GITLAB_ADDR}" resolvers docker init-addr last,libc,none
.endif

backend vector
    http-request set-uri /events
    http-request del-header Authorization
    # The user whose token passed the checks above.
    http-request set-header X-Furnish-User %[var(txn.email)]
    server vector vector:8080 resolvers docker init-addr last,libc,none
